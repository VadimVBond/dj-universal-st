{% load i18n %}
<section class="component component-contact bg-gray-50 py-16">
    <div class="max-w-6xl mx-auto px-4">
        <h2 class="text-2xl font-semibold">{% trans "Contact" %}</h2>
        <p class="mt-2 text-gray-600">{% trans "Tell us about your project idea." %}</p>
        <form class="mt-6 grid gap-4 md:grid-cols-2" method="post" action="#">
            <input class="border rounded p-3" type="text" name="name" placeholder="{% trans "Name" %}">
            <input class="border rounded p-3" type="email" name="email" placeholder="{% trans "Email" %}">
            <textarea class="border rounded p-3 md:col-span-2" name="message" rows="4" placeholder="{% trans "Message" %}"></textarea>
            <div class="md:col-span-2">
                <button class="px-5 py-3 bg-gray-900 text-white rounded" type="submit">{% trans "Send message" %}</button>
            </div>
        </form>
    </div>
</section>
