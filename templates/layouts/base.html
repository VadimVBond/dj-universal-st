<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Starter{% endblock %}</title>
<link id="theme-css" rel="stylesheet" href="{% static 'css/themes/tailwind.css' %}">
<script>
function switchTheme(theme){
    document.getElementById('theme-css').href='/static/css/themes/'+theme+'.css';
}
</script>
</head>
<body>
<nav>
<button onclick="switchTheme('tailwind')">Tailwind</button>
<button onclick="switchTheme('bootstrap')">Bootstrap</button>
<button onclick="switchTheme('flowbite')">Flowbite</button>
<button onclick="switchTheme('daisyui')">DaisyUI</button>
<button onclick="switchTheme('preline')">Preline</button>
</nav>
{% block content %}{% endblock %}
</body>
</html>
