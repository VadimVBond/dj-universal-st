{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Starter{% endblock %}</title>
    {% block theme_css %}
        <link id="theme-css" rel="stylesheet" href="{% static 'css/themes/tailwind.css' %}?v=20260315">
    {% endblock %}
    {% block extra_head %}{% endblock %}
    <script>
        const THEME_VERSION = '20260315';
        function switchTheme(theme) {
            document.getElementById('theme-css').href = '/static/css/themes/' + theme + '.css?v=' + THEME_VERSION;
        }
    </script>
</head>
<body class="bg-white text-gray-900">
    {% include "components/navbar.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include "components/footer.html" %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
